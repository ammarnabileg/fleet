name: fleet

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-app: &app
  image: ${APP_IMAGE:-fleet-backend:dev}
  build: ../backend
  env_file: .env
  restart: unless-stopped
  logging: *logging
  volumes:
    - files:/data/files

x-app-deps: &app-deps
  migrate:
    condition: service_completed_successfully
  redis-queue:
    condition: service_healthy
  redis-cache:
    condition: service_healthy

services:
  web:
    build: ../web
    restart: unless-stopped
    logging: *logging
    expose: ["80"]
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }

  migrate:
    <<: *app
    restart: "no"
    environment:
      DATABASE_URL: ${MIGRATIONS_DATABASE_URL}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ["uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000",
              "--workers", "4", "--proxy-headers", "--forwarded-allow-ips", "*"]
    expose: ["8000"]
    depends_on: *app-deps
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "2", memory: 2g }

  worker:
    <<: *app
    command: ["celery", "-A", "app.worker", "worker", "--concurrency", "4", "--loglevel", "INFO"]
    depends_on: *app-deps
    deploy:
      resources:
        limits: { cpus: "2", memory: 3g }

  beat:                       # exactly one replica
    <<: *app
    command: ["celery", "-A", "app.worker", "beat", "--loglevel", "INFO",
              "--schedule", "/tmp/celerybeat-schedule"]
    depends_on: *app-deps
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 256m }

  postgres:
    build: ./postgres
    restart: unless-stopped
    logging: *logging
    shm_size: 1g
    environment:
      POSTGRES_DB: fleet
      POSTGRES_USER: fleet_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGBACKREST_REPO1_S3_KEY: ${PGBACKREST_REPO1_S3_KEY}
      PGBACKREST_REPO1_S3_KEY_SECRET: ${PGBACKREST_REPO1_S3_KEY_SECRET}
      PGBACKREST_REPO1_CIPHER_PASS: ${PGBACKREST_REPO1_CIPHER_PASS}
    command:
      - postgres
      - -c
      - shared_buffers=4GB
      - -c
      - effective_cache_size=8GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - max_connections=100
      - -c
      - max_wal_size=4GB
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=fleet archive-push %p
      - -c
      - archive_timeout=60
      - -c
      - idle_in_transaction_session_timeout=60s
      - -c
      - log_min_duration_statement=500
      - -c
      - timezone=UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet_owner -d fleet"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "3", memory: 6g }

  redis-queue:                # Celery broker + rate limits: never evict, persist every second
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec",
              "--maxmemory", "512mb", "--maxmemory-policy", "noeviction",
              "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redisqueue:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 768m }

  redis-cache:                # cache + live-map pub/sub: disposable, evicts least recently used
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru",
              "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 384m }

volumes:
  pgdata:
  redisqueue:
  files:
