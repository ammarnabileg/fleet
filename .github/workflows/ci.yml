name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest
        env:
          TEST_ADMIN_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres

  images:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t fleet-backend:ci backend
      - run: docker build -t fleet-web:ci web
      - name: nginx configuration is valid
        run: docker run --rm --add-host api:127.0.0.1 fleet-web:ci nginx -t
      - run: docker build -t fleet-postgres:ci deploy/postgres

  # the admin panel in a real browser against a real backend: every page and tab, phone width, and whole flows
  web-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fleet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/e2e/package-lock.json
      - name: start the panel and its backend on one origin
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/fleet
          SECRET_KEY: ci-e2e-secret-key-not-for-production
          COOKIE_SECURE: "false"
          APP_ENV: development
          MESSAGING_PROVIDER: log
          LIVE_BROKER: memory
          FILES_DIR: /tmp/fleet-files
          ADMIN_PASSWORD: correct-horse-battery
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          python -m app.ops.bootstrap --username admin --full-name "CI Admin"
          nohup uvicorn app.ops.devserver:app --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/healthz && break; sleep 1; done
          curl -sf -o /dev/null http://127.0.0.1:8000/admin.html
      - name: browser tests
        working-directory: web/e2e
        env:
          BASE_URL: http://127.0.0.1:8000
          ADMIN_PASSWORD: correct-horse-battery
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test || (for f in test-results/*/error-context.md; do echo "== $f"; cat "$f"; done; tail -n 100 /tmp/api.log; exit 1)
      # again with every animation frame 250 ms late, as on a slow phone, and every save 800 ms late, as on a busy server:
      # a test or a screen that depends on the frame timing, or a test that goes on before its save has finished, fails
      # here every time instead of once in a while
      - name: browser tests, slow frames and slow saves
        working-directory: web/e2e
        env:
          BASE_URL: http://127.0.0.1:8000
          ADMIN_PASSWORD: correct-horse-battery
          SLOW_FRAMES: "250"
          SLOW_SAVES: "800"
        run: npx playwright test || (for f in test-results/*/error-context.md; do echo "== $f"; cat "$f"; done; tail -n 100 /tmp/api.log; exit 1)
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-e2e-report
          path: |
            web/e2e/playwright-report
            web/e2e/test-results
          retention-days: 14

  driver-app:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fleet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true
      - name: analyze and test
        working-directory: driver_app
        run: |
          flutter pub get
          flutter analyze
          flutter test --exclude-tags contract
      # the app's own code against a real backend: activation link, tracking, readings, reports, registration
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: start a backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/fleet
          SECRET_KEY: ci-contract-secret-key-not-for-production
          COOKIE_SECURE: "false"
          APP_ENV: development
          MESSAGING_PROVIDER: log
          LIVE_BROKER: memory
          FILES_DIR: /tmp/fleet-files
          ADMIN_PASSWORD: correct-horse-battery
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          python -m app.ops.bootstrap --username admin --full-name "CI Admin"
          nohup uvicorn app.main:create_app --factory --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/healthz && break; sleep 1; done
      - name: contract test
        working-directory: driver_app
        env:
          BACKEND_URL: http://127.0.0.1:8000
        run: flutter test --tags contract || (cat /tmp/api.log; exit 1)
      - name: build the APK
        working-directory: driver_app
        # the deployed address the app talks to and the activation links open; the repository variable
        # DRIVER_API_URL replaces it (another deployment) without touching this file
        env:
          API_URL: ${{ vars.DRIVER_API_URL || 'https://fleet.kuw1.com' }}
        run: flutter build apk --debug --dart-define=API_URL="$API_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: driver-app-debug-apk
          path: driver_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
