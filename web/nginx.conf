server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 12m;          # uploads up to 10MB (BRD) + margin

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # live map stream (SSE): no buffering, long-lived connection
    location = /api/v1/tracking/live/stream {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # driver activation links: the token stays after "#" and never reaches the server or its logs
    location = /activate {
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        try_files /activate.html =404;
    }

    # the self-hosted map: one PMTiles file of Kuwait (deploy/maps/update-map.sh), read by the browser in small
    # HTTP Range requests (nginx serves ranges of static files as is). Missing file -> 404, the map falls back.
    location ^~ /maps/ {
        alias /srv/maps/;
        expires 1h;
    }

    # MapLibre's ES modules: browsers load module scripts and workers only with a JavaScript type,
    # and nginx's mime.types has no .mjs
    location ~ \.mjs$ {
        types { text/javascript mjs; }
        try_files $uri =404;
    }

    # the panel's own pages, scripts and styles: the browser asks each time whether they changed (a small 304 when
    # not), so a new deploy shows at once instead of the copy it kept. add_header here replaces the server's, so
    # those are repeated.
    location ~* \.(?:html|js|css)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;  # index.html for the app's routes
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        try_files $uri $uri/ /index.html;
    }
}
