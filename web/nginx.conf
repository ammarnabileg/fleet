# the main domain (example.com, www.example.com) opens the company's public site; any other host (dash.example.com,
# the old address) opens the panel as before
map $host $front_page {
    default                      index.html;
    "~^(www\.)?[^.]+\.[^.]+$"  site.html;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 12m;          # uploads up to 10MB (BRD) + margin

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # our own pages for errors (the API answers its own errors in JSON; these are for pages, and for the API down)
    error_page 403 /403.html;
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        try_files /$front_page =404;
    }

    location ~ ^/(403|404|50x)\.html$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # the API down (restarting, a deploy): a JSON answer the panel and the app understand, never an HTML page
    location @api_down {
        default_type application/json;
        add_header Retry-After 30 always;
        return 503 '{"code":"service_unavailable","message":"The system is not available right now. Try again shortly."}';
    }

    # live map stream (SSE): no buffering, long-lived connection
    location = /api/v1/tracking/live/stream {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # the driver app's releases: an APK is ~65 MB (MAX_APK_MB on the API, 150 by default), allowed here only
    location = /api/v1/app-releases {
        client_max_body_size 160m;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
        error_page 502 503 504 = @api_down;
    }

    # the driver app's public download link (/app/download, /app/download/<version>): the APK from our own server,
    # whoever stores it; ~65 MB on a phone's network takes a while
    location ^~ /app/download {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # driver activation links: the token stays after "#" and never reaches the server or its logs
    location = /activate {
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        try_files /activate.html =404;
    }

    # the self-hosted map: one PMTiles file of Kuwait (the compose "maps" service), read by the browser in small
    # HTTP Range requests (nginx serves ranges of static files as is). Missing file -> 404, the map falls back.
    location ^~ /maps/ {
        alias /srv/maps/;
        expires 1h;
        # files being written (.work/, *.new) are never served
        location ~ (/\.|\.new$) {
            return 404;
        }
    }

    # what the "maps" service is doing (downloading, failed and why, when it tries again): the panel shows it next to
    # the fallback map. Small and changing, so never kept by the browser.
    location = /maps/status.json {
        alias /srv/maps/status.json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }

    # MapLibre's ES modules: browsers load module scripts and workers only with a JavaScript type,
    # and nginx's mime.types has no .mjs
    location ~ \.mjs$ {
        types { text/javascript mjs; }
        try_files $uri =404;
    }

    # the panel's own pages, scripts and styles: the browser asks each time whether they changed (a small 304 when
    # not), so a new deploy shows at once instead of the copy it kept. add_header here replaces the server's, so
    # those are repeated.
    location ~* \.(?:html|js|css)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;  # index.html for the app's routes
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        try_files $uri $uri/ =404;
    }
}
