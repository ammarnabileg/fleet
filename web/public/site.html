<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>…</title>
<meta name="description" content="">
<link rel="stylesheet" href="/ui/css/ui.css">
<style>
/* the public site: the design system's components and tokens only; a few layout rules for this one page */
.site-wrap { max-width: var(--content-max); margin: 0 auto; padding-inline: var(--pad); box-sizing: border-box; }
.site-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 100%; }
.site-name { font-size: var(--fs-h3); font-weight: var(--w-bold); color: var(--ink); letter-spacing: -.01em; }
.site-nav { display: flex; align-items: center; gap: 4px; }
.site-hero { padding: 64px 0 48px; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 32px; align-items: center; }
.site-hero h1 { margin: 0 0 12px; text-wrap: balance; }
.site-hero p { margin: 0 0 24px; color: var(--muted); font-size: var(--fs-h3); line-height: 1.8; max-width: 620px; }
.site-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.site-panel { background: var(--brand-soft); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 24px; display: flex; flex-direction: column; gap: 14px; }
.site-panel-row { display: flex; gap: 12px; align-items: flex-start; }
.site-panel-row .icon { color: var(--brand-700); flex: 0 0 auto; margin-top: 3px; }
.site-panel-row b { display: block; color: var(--ink); font-weight: var(--w-semi); }
.site-panel-row span { color: var(--muted); font-size: var(--fs-small); }
.site-section { padding: 40px 0; }
.site-about { max-width: 820px; white-space: pre-line; color: var(--ink-2); margin: 0; }
.site-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.site-grid .ui-card h3 { margin: 10px 0 4px; }
.site-grid .ui-card p { margin: 0; color: var(--muted); font-size: var(--fs-small); }
.site-ic { width: 44px; height: 44px; border-radius: var(--r-md); background: var(--brand-soft); color: var(--brand-700); display: grid; place-items: center; }
.site-contact { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 16px; align-items: start; }
.site-info { display: flex; flex-direction: column; gap: 12px; }
.site-info a, .site-info b { display: flex; gap: 10px; align-items: center; font-weight: var(--w-medium); color: var(--ink); }
.site-info .icon { color: var(--brand-700); }
.site-form { display: flex; flex-direction: column; gap: 14px; }
.site-form .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.site-hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.ltr { direction: ltr; unicode-bidi: isolate; }
@media (max-width: 820px) {
  .site-hero, .site-contact { grid-template-columns: 1fr; }
  .site-hero { padding: 36px 0 28px; }
  .site-nav .nav-link { display: none; }
  .site-form .two { grid-template-columns: 1fr; }
}
</style>
</head>
<body class="ui">
<a class="ui-skip" href="#main" data-t="skip"></a>
<header class="ui-header"><div class="site-wrap site-head">
  <a href="#main" class="site-name" data-name></a>
  <nav class="site-nav">
    <a class="ui-btn is-ghost is-sm nav-link" href="#about" data-t="about"></a>
    <a class="ui-btn is-ghost is-sm nav-link" href="#services" data-t="services"></a>
    <a class="ui-btn is-ghost is-sm nav-link" href="#contact" data-t="contact"></a>
    <button class="ui-btn is-outline is-sm" type="button" data-lang-btn></button>
  </nav>
</div></header>

<main id="main" class="site-wrap">
  <div class="site-hero">
    <div>
      <span class="ui-eyebrow" data-address-eyebrow></span>
      <h1 data-name></h1>
      <p data-tagline></p>
      <div class="site-actions">
        <a class="ui-btn is-brand is-lg" href="/app/download" data-download hidden><svg class="icon"><use href="/ui/icons/sprite.svg#i-download"/></svg><span data-t="download"></span></a>
        <a class="ui-btn is-primary is-lg" href="#contact"><svg class="icon"><use href="/ui/icons/sprite.svg#i-message"/></svg><span data-t="contact"></span></a>
      </div>
    </div>
    <div class="site-panel" data-panel></div>
  </div>

  <section class="site-section" id="about">
    <div class="ui-section-head"><div><span class="ui-eyebrow" data-t="aboutEyebrow"></span><h2 data-t="about"></h2></div></div>
    <p class="site-about" data-about></p>
  </section>

  <section class="site-section" id="services" data-services-box>
    <div class="ui-section-head"><div><span class="ui-eyebrow" data-t="servicesEyebrow"></span><h2 data-t="services"></h2></div></div>
    <div class="site-grid" data-services></div>
  </section>

  <section class="site-section" id="contact">
    <div class="ui-section-head"><div><span class="ui-eyebrow" data-t="contactEyebrow"></span><h2 data-t="contact"></h2></div></div>
    <div class="site-contact">
      <div class="ui-card site-info" data-info></div>
      <form class="ui-card site-form" data-form novalidate>
        <div><label class="ui-label" for="f-name" data-t="name"></label><input id="f-name" class="ui-field" name="name" required minlength="2" maxlength="120" autocomplete="name"></div>
        <div class="two">
          <div><label class="ui-label" for="f-phone" data-t="phone"></label><input id="f-phone" class="ui-field ltr" name="phone" maxlength="120" inputmode="tel" autocomplete="tel"></div>
          <div><label class="ui-label" for="f-email" data-t="email"></label><input id="f-email" class="ui-field ltr" name="email" type="email" maxlength="120" autocomplete="email"></div>
        </div>
        <div><label class="ui-label" for="f-msg" data-t="message"></label><textarea id="f-msg" class="ui-field" name="message" rows="5" required minlength="5" maxlength="3000"></textarea></div>
        <label class="site-hp" aria-hidden="true">website<input name="website" tabindex="-1" autocomplete="off"></label>
        <div class="ui-notice" data-result hidden style="margin:0"><div><strong data-result-text></strong></div></div>
        <div><button class="ui-btn is-primary" type="submit"><svg class="icon"><use href="/ui/icons/sprite.svg#i-send"/></svg><span data-t="send"></span></button></div>
      </form>
    </div>
  </section>
</main>

<footer class="ui-footer">
  <div class="ui-footer-top">
    <div class="ui-footer-brand"><strong style="color:#fff;font-size:var(--fs-h3)" data-name></strong><p data-tagline></p></div>
  </div>
  <div class="ui-footer-base"><p>© <span data-year></span> <span data-name></span> · <span data-t="rights"></span></p></div>
</footer>

<script>
(function () {
  'use strict';
  var T = {
    ar: { skip: 'تخطَّ إلى المحتوى', about: 'عن الشركة', services: 'خدماتنا', contact: 'تواصل معنا', download: 'تحميل تطبيق السائق', aboutEyebrow: 'مين إحنا', servicesEyebrow: 'بنقدّم إيه', contactEyebrow: 'إحنا هنا', name: 'الاسم', phone: 'رقم التليفون', email: 'الإيميل', message: 'رسالتك', send: 'إرسال', phoneL: 'تليفون', whatsapp: 'واتساب', emailL: 'إيميل', address: 'العنوان', map: 'افتح الخريطة', sent: 'وصلتنا رسالتك، هنتواصل معاك قريب.', needContact: 'اكتب رقم تليفون أو إيميل عشان نرد عليك.', fail: 'الرسالة ما اتبعتتش. جرّب تاني بعد شوية.', check: 'اكتب الاسم والرسالة.', other: 'English', rights: 'جميع الحقوق محفوظة' },
    en: { skip: 'Skip to content', about: 'About us', services: 'Our services', contact: 'Contact us', download: 'Download the driver app', aboutEyebrow: 'Who we are', servicesEyebrow: 'What we do', contactEyebrow: 'Get in touch', name: 'Name', phone: 'Phone', email: 'Email', message: 'Your message', send: 'Send', phoneL: 'Phone', whatsapp: 'WhatsApp', emailL: 'Email', address: 'Address', map: 'Open the map', sent: 'We got your message and will get back to you soon.', needContact: 'Give a phone number or an email so we can reply.', fail: 'Your message was not sent. Please try again shortly.', check: 'Write your name and your message.', other: 'العربية', rights: 'All rights reserved' }
  };
  var ICONS = ['truck', 'map', 'users', 'shield', 'clock', 'wallet', 'phone', 'chart', 'box', 'support', 'award', 'target'];
  var SPRITE = '/ui/icons/sprite.svg#i-';
  var site = null, lang = 'ar';
  try { lang = localStorage.getItem('site.lang') || ((navigator.language || '').indexOf('ar') === 0 ? 'ar' : 'en'); } catch (e) { /* private mode */ }
  var $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
  var $ = function (s) { return document.querySelector(s); };
  function pick(v) { return v ? (v[lang] || v.ar || v.en || '') : ''; }
  function el(tag, text, cls) { var e = document.createElement(tag); if (text) e.textContent = text; if (cls) e.className = cls; return e; }
  function icon(name) {
    var ns = 'http://www.w3.org/2000/svg', s = document.createElementNS(ns, 'svg'), u = document.createElementNS(ns, 'use');
    s.setAttribute('class', 'icon'); s.setAttribute('aria-hidden', 'true'); u.setAttribute('href', SPRITE + name); s.appendChild(u); return s;
  }

  function draw() {
    var t = T[lang];
    document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    $$('[data-t]').forEach(function (e) { e.textContent = t[e.getAttribute('data-t')]; });
    $('[data-lang-btn]').textContent = t.other;
    if (!site) return;
    var name = pick(site.company_name);
    document.title = name;
    $('meta[name=description]').setAttribute('content', pick(site.tagline));
    $$('[data-name]').forEach(function (e) { e.textContent = name; });
    $$('[data-tagline]').forEach(function (e) { e.textContent = pick(site.tagline); });
    $('[data-address-eyebrow]').textContent = pick(site.address);
    $('[data-about]').textContent = pick(site.about);
    $('[data-download]').hidden = !site.download;

    var box = $('[data-services]'); box.textContent = '';
    (site.services || []).forEach(function (s, i) {
      var c = el('div', '', 'ui-card'), ic = el('span', '', 'site-ic');
      ic.appendChild(icon(ICONS[i % ICONS.length])); c.appendChild(ic);
      c.appendChild(el('h3', pick(s.title))); if (pick(s.text)) c.appendChild(el('p', pick(s.text)));
      box.appendChild(c);
    });
    $('[data-services-box]').hidden = !(site.services || []).length;

    function contacts(target, rich) {
      target.textContent = '';
      function row(ic, label, value, href, ltr) {
        if (!value) return;
        if (rich) {
          var r = el('div', '', 'site-panel-row'); r.appendChild(icon(ic));
          var d = el('div'); d.appendChild(el('b', value)); d.appendChild(el('span', label)); if (ltr) d.firstChild.className = 'ltr';
          r.appendChild(d); target.appendChild(r);
        } else {
          var a = el(href ? 'a' : 'b'); if (href) a.href = href;
          a.appendChild(icon(ic)); var s = el('span', value); if (ltr) s.className = 'ltr'; a.appendChild(s); target.appendChild(a);
        }
      }
      row('phone', t.phoneL, site.phone, 'tel:' + site.phone.replace(/[^\d+]/g, ''), true);
      row('whatsapp', t.whatsapp, site.whatsapp, 'https://wa.me/' + site.whatsapp.replace(/\D/g, ''), true);
      row('mail', t.emailL, site.email, 'mailto:' + site.email, true);
      row('map', t.address, pick(site.address), site.map_url || null);
    }
    contacts($('[data-panel]'), true);
    $('[data-panel]').hidden = !$('[data-panel]').children.length;
    contacts($('[data-info]'), false);
    if (site.map_url) { var m = el('a'); m.href = site.map_url; m.target = '_blank'; m.rel = 'noopener'; m.className = 'ui-btn is-outline is-sm'; m.appendChild(icon('link')); m.appendChild(el('span', t.map)); $('[data-info]').appendChild(m); }
    $('[data-form]').hidden = !site.show_contact_form;
  }

  $('[data-lang-btn]').addEventListener('click', function () {
    lang = lang === 'ar' ? 'en' : 'ar';
    try { localStorage.setItem('site.lang', lang); } catch (e) { /* private mode */ }
    draw();
  });
  $('[data-year]').textContent = new Date().getFullYear();

  var form = $('[data-form]'), result = $('[data-result]');
  function say(text, bad) { result.hidden = false; $('[data-result-text]').textContent = text; result.className = 'ui-notice ' + (bad ? 'is-bad' : 'is-good'); }
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var f = new FormData(form), body = {};
    f.forEach(function (v, k) { body[k] = String(v).trim(); });
    if (body.name.length < 2 || body.message.length < 5) return say(T[lang].check, true);
    if (!body.phone && !body.email) return say(T[lang].needContact, true);
    var btn = form.querySelector('[type=submit]'); btn.disabled = true;
    fetch('/api/v1/site/contact', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept-Language': lang }, body: JSON.stringify(body) })
      .then(function (r) {
        btn.disabled = false;
        if (r.status === 204) { form.reset(); say(T[lang].sent); } else say(T[lang].fail, true);
      }, function () { btn.disabled = false; say(T[lang].fail, true); });
  });

  draw();
  fetch('/api/v1/site').then(function (r) { return r.ok ? r.json() : null; }).then(function (s) {
    if (!s) { location.replace('/404.html'); return; }
    site = s; draw();
  }, function () { location.replace('/50x.html'); });
})();
</script>
</body>
</html>
