<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مكتبة المكونات — BrilliantTech UI</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230A6CFF'/%3E%3Cpath d='M12 5l6 7-6 7-6-7z' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/overlays.css">
  <style>
    .kit { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 28px; max-width: 1320px; margin: 0 auto; padding: 24px; }
    .kit-nav { position: sticky; top: 20px; align-self: start; display: flex; flex-direction: column; gap: 2px; }
    .kit-nav a { padding: 7px 10px; border-radius: 8px; color: var(--text-2); font-size: 13.5px; text-decoration: none; }
    .kit-nav a:hover { background: var(--surface-3); }
    .kit-sec { background: var(--surface-glass); border: 1px solid var(--border); border-radius: 18px; padding: 22px; margin-bottom: 22px; scroll-margin-top: 20px; }
    .kit-sec > h2 { font-size: 20px; margin-bottom: 4px; }
    .kit-sec > p.lead { color: var(--text-3); font-size: 13.5px; margin-bottom: 16px; }
    .demo { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 10px 0 14px; }
    .swatch { width: 128px; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); background: var(--surface); font-size: 11.5px; }
    .swatch i { display: block; height: 52px; }
    .swatch span { display: block; padding: 6px 8px; direction: ltr; text-align: right; color: var(--text-2); }
    .kit-h3 { font-size: 14px; font-weight: 700; color: var(--text); margin: 18px 0 6px; }
    @media (max-width: 900px) { .kit { grid-template-columns: minmax(0, 1fr); padding: 14px; } .kit-nav { position: static; flex-direction: row; flex-wrap: wrap; } }
  </style>
</head>
<body class="bt-bg">
  <header class="topbar" style="position:sticky">
    <span class="logo sm"><i data-icon="diamond" data-size="14"></i></span><div class="tb-title"><div class="crumbs">BrilliantTech UI</div><h1>مكتبة المكونات والنوافذ المنبثقة</h1></div>
    <div class="tb-actions"><a class="btn btn-ghost btn-sm" href="index.html"><i data-icon="layout-grid" data-size="15"></i> كل الواجهات</a><button type="button" class="icon-btn" id="kit-theme" data-theme-icon="18" aria-label="الوضع الداكن"><i data-icon="moon" data-size="18"></i></button></div>
  </header>
  <div class="kit">
    <nav class="kit-nav" id="kit-nav" aria-label="الأقسام"></nav>
    <main id="kit"></main>
  </div>

  <script src="assets/js/kit.js"></script>
</body>
</html>
