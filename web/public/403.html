<style>
:root{--bg:#f7f8fa;--card:#fff;--ink:#14202b;--soft:#5b6774;--line:#e1e5ea;--accent:#0f5c8c}

*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);

.box{max-width:520px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px;text-align:center}

p{color:var(--soft);margin:0 0 6px;line-height:1.7}
.en{direction:ltr;margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
a,button{font:inherit;font-weight:600;padding:10px 18px;border-radius:10px;border:1px solid var(--accent);text-decoration:none;cursor:pointer}
.p{background:var(--accent);color:#fff}.g{background:none;color:var(--accent)}
</style>
</head>
