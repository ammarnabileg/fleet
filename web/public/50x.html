<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>السيستم مش متاح دلوقتي · The system is not available right now</title>
<link rel="stylesheet" href="/ui/css/ui.css">
<style>
.err { min-height: 100vh; display: grid; place-items: center; padding: var(--pad); box-sizing: border-box; }
.err .ui-card { max-width: 520px; width: 100%; text-align: center; padding: 32px; }
.err-code { font-size: 56px; font-weight: var(--w-bold); color: var(--brand-700); line-height: 1; letter-spacing: -.02em; }
.err h1 { font-size: var(--fs-h2); margin: 14px 0 6px; }
.err p { color: var(--muted); margin: 0; }
.err .en { direction: ltr; margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); }
.err .en h1 { font-size: var(--fs-h3); }
.err-actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
</style>
</head>
<body class="ui">
<main class="err"><div class="ui-card">
  <div class="err-code"><bdi>503</bdi></div>
  <h1>السيستم مش متاح دلوقتي</h1>
  <p>ممكن يكون بيتحدّث أو فيه عطل. جرّب تاني بعد دقايق.</p>
  <div class="en"><h1>The system is not available right now</h1><p>It may be updating or having a problem. Please try again in a few minutes.</p></div>
  <div class="err-actions"><button class="ui-btn is-primary" type="button" onclick="location.reload()">جرّب تاني · Try again</button></div>
</div></main>
</body>
</html>
